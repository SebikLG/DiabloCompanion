<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0c">
<title>Diablo Companion — S15</title>
<style>
:root{--bg:#0d0c0c;--line:#332b27;--text:#f3eee9;--muted:#a79b93;--accent:#d97935}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 80% -10%,rgba(217,121,53,.12),transparent 34%),var(--bg)}
button{font:inherit}.app{width:100%;height:100dvh;min-height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.profile-switch{min-width:0;background:rgba(13,12,12,.99);border-bottom:1px solid #302825;padding:15px 14px;z-index:5}
.profile-switch-inner{width:100%;max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.profilebtn{min-width:0;min-height:74px;border:1px solid var(--line);background:#151313;color:#e3dad4;border-radius:18px;padding:12px 9px;font-weight:900;font-size:clamp(14px,3.9vw,18px);line-height:1.15;cursor:pointer;white-space:normal;overflow-wrap:anywhere;text-align:center}
.profilebtn.active{border-color:#c96e35;background:#2a1d16;color:#ffd2ad;box-shadow:0 0 0 1px rgba(217,121,53,.18) inset}
.content{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:14px}
.profile{display:none}.profile.active{display:block}.view{display:none}.view.active{display:block}
.start-card{max-width:760px;margin:0 auto;background:#141212;border:1px solid #302825;border-radius:18px;padding:14px 12px 16px}
.start-card h2{margin:0 0 13px;font-size:1rem;color:#f1e8e1}
.skill-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.skill-slot{min-width:0;text-align:center}
.skill-slot img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid #51453f;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.skill-slot span{display:block;margin-top:5px;color:#ddd3cc;font-size:clamp(8px,2.2vw,11px);line-height:1.08;font-weight:750;overflow-wrap:anywhere}
.bottom-shell{min-width:0;background:rgba(13,12,12,.99);border-top:1px solid #302825;padding-bottom:max(30px,env(safe-area-inset-bottom));z-index:5}
.bottomnav{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:8px 8px 7px}.bottomnav::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 74px;border:0;background:transparent;color:var(--muted);border-radius:18px;padding:10px 7px 9px;font-size:.76rem;cursor:pointer}
.navbtn b{display:block;font-size:1.22rem;line-height:1.05;margin-bottom:5px}.navbtn.active{background:#2b1e17;color:#ffd0aa}
@media(max-width:380px){.skill-strip{gap:4px}.start-card{padding-left:9px;padding-right:9px}}
@media(min-width:760px){.bottomnav{justify-content:center}.navbtn{flex-basis:84px}}
</style>
</head>
<body>
<div class="app">
<header class="profile-switch"><div class="profile-switch-inner">
<button class="profilebtn active" data-profile="kasia-early">Kasia Early Endgame</button>
<button class="profilebtn" data-profile="kasia-unique">Kasia Unique Endgame</button>
</div></header>

<script>
(()=>{const tabs=['start','skills','gear','aspects','extras','merc','transition','sources'],profiles=['kasia-early','kasia-unique'],content=document.getElementById('content');let activeTab='start',activeProfile='kasia-early';try{const t=localStorage.getItem('diablo-companion-tab'),p=localStorage.getItem('diablo-companion-profile');if(tabs.includes(t))activeTab=t;if(profiles.includes(p))activeProfile=p}catch(e){}
function openTab(tab,scroll=true){if(!tabs.includes(tab))tab='start';document.querySelectorAll('[data-tab-view]').forEach(v=>v.classList.toggle('active',v.dataset.tabView===tab));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));activeTab=tab;try{localStorage.setItem('diablo-companion-tab',tab)}catch(e){}if(scroll)content.scrollTo({top:0,behavior:'auto'})}
function openProfile(profile,scroll=true){if(!profiles.includes(profile))profile='kasia-early';document.querySelectorAll('[data-profile-panel]').forEach(p=>p.classList.toggle('active',p.dataset.profilePanel===profile));document.querySelectorAll('.profilebtn').forEach(b=>b.classList.toggle('active',b.dataset.profile===profile));activeProfile=profile;try{localStorage.setItem('diablo-companion-profile',profile)}catch(e){}openTab(activeTab,false);if(scroll)content.scrollTo({top:0,behavior:'auto'})}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab,true)));document.querySelectorAll('.profilebtn').forEach(b=>b.addEventListener('click',()=>openProfile(b.dataset.profile,true)));openProfile(activeProfile,false);openTab(activeTab,false)})();
</script>
