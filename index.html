<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0c">
<title>Diablo Companion — S15</title>
<style>
:root{
  --bg:#0d0c0c;
  --line:#332b27;
  --text:#f3eee9;
  --muted:#a79b93;
  --accent:#d97935;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{
  height:100dvh;
  display:flex;
  flex-direction:column;
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 80% -10%,rgba(217,121,53,.12),transparent 34%),var(--bg);
}
button{font:inherit}

/* GÓRA — zawsze nieruchoma */
.profile-switch{
  flex:0 0 auto;
  z-index:10;
  background:rgba(13,12,12,.98);
  border-bottom:1px solid #302825;
  padding:15px 14px;
}
.profile-switch-inner{
  width:100%;
  max-width:760px;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
}
.profilebtn{
  min-width:0;
  border:1px solid var(--line);
  background:#151313;
  color:#e3dad4;
  border-radius:18px;
  padding:15px 10px;
  font-weight:900;
  font-size:clamp(14px,4vw,18px);
  line-height:1.12;
  cursor:pointer;
}
.profilebtn.active{
  border-color:#c96e35;
  background:#2a1d16;
  color:#ffd2ad;
  box-shadow:0 0 0 1px rgba(217,121,53,.18) inset;
}

/* ŚRODEK — tylko ta część może się przewijać */
.content{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.profile{display:none;min-height:100%}
.profile.active{display:block}
.view{display:none;min-height:100%}
.view.active{display:block}

/* DÓŁ — zawsze nieruchomy */
.bottomnav{
  flex:0 0 auto;
  z-index:10;
  display:flex;
  gap:5px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  background:rgba(13,12,12,.98);
  border-top:1px solid #302825;
  border-bottom:1px solid #302825;
  padding:8px 8px 7px;
}
.bottomnav::-webkit-scrollbar{display:none}
.navbtn{
  flex:0 0 74px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:18px;
  padding:10px 7px 9px;
  font-size:.76rem;
  cursor:pointer;
}
.navbtn b{
  display:block;
  font-size:1.22rem;
  line-height:1.05;
  margin-bottom:5px;
}
.navbtn.active{
  background:#2b1e17;
  color:#ffd0aa;
}

/* Stałe miejsce na androidowy pasek gestów */
.android-gesture-space{
  flex:0 0 38px;
  height:38px;
  background:#0d0c0c;
}

@media(min-width:760px){
  .bottomnav{justify-content:center}
  .navbtn{flex-basis:84px}
}
</style>
</head>
<body>

<header class="profile-switch" aria-label="Wybór buildu Kasi">
  <div class="profile-switch-inner">
    <button class="profilebtn active" data-profile="kasia-early">Kasia Early Endgame</button>
    <button class="profilebtn" data-profile="kasia-unique">Kasia Unique Endgame</button>
  </div>
</header>

<main class="content" id="content" aria-live="polite">
  <div class="profile active" data-profile-panel="kasia-early">
    <section class="view active" data-tab-view="start"></section>
    <section class="view" data-tab-view="skills"></section>
    <section class="view" data-tab-view="gear"></section>
    <section class="view" data-tab-view="aspects"></section>
    <section class="view" data-tab-view="extras"></section>
    <section class="view" data-tab-view="merc"></section>
    <section class="view" data-tab-view="transition"></section>
    <section class="view" data-tab-view="sources"></section>
  </div>

  <div class="profile" data-profile-panel="kasia-unique">
    <section class="view active" data-tab-view="start"></section>
    <section class="view" data-tab-view="skills"></section>
    <section class="view" data-tab-view="gear"></section>
    <section class="view" data-tab-view="aspects"></section>
    <section class="view" data-tab-view="extras"></section>
    <section class="view" data-tab-view="merc"></section>
    <section class="view" data-tab-view="transition"></section>
    <section class="view" data-tab-view="sources"></section>
  </div>
</main>

<nav class="bottomnav" aria-label="Główna nawigacja">
  <button class="navbtn active" data-tab="start"><b>⌂</b>Start</button>
  <button class="navbtn" data-tab="skills"><b>✦</b>Skille</button>
  <button class="navbtn" data-tab="gear"><b>◈</b>Gear</button>
  <button class="navbtn" data-tab="aspects"><b>◆</b>Aspekty</button>
  <button class="navbtn" data-tab="extras"><b>✧</b>Dodatki</button>
  <button class="navbtn" data-tab="merc"><b>♜</b>Pomocnik</button>
  <button class="navbtn" data-tab="transition"><b>⇢</b>Endgame</button>
  <button class="navbtn" data-tab="sources"><b>i</b>Info</button>
</nav>
<div class="android-gesture-space" aria-hidden="true"></div>

<script>
(function(){
  const TAB_KEY='diablo-companion-tab';
  const PROFILE_KEY='diablo-companion-profile';
  const tabs=['start','skills','gear','aspects','extras','merc','transition','sources'];
  const profiles=['kasia-early','kasia-unique'];
  const content=document.getElementById('content');

  let activeTab='start';
  let activeProfile='kasia-early';
  try{
    const t=localStorage.getItem(TAB_KEY);
    const p=localStorage.getItem(PROFILE_KEY);
    if(tabs.includes(t)) activeTab=t;
    if(profiles.includes(p)) activeProfile=p;
  }catch(e){}

  function openTab(tab, scroll=true){
    if(!tabs.includes(tab)) tab='start';
    document.querySelectorAll('[data-tab-view]').forEach(v=>v.classList.toggle('active',v.dataset.tabView===tab));
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    activeTab=tab;
    try{localStorage.setItem(TAB_KEY,tab)}catch(e){}
    if(scroll) content.scrollTo({top:0,behavior:'auto'});
  }

  function openProfile(profile, scroll=true){
    if(!profiles.includes(profile)) profile='kasia-early';
    document.querySelectorAll('[data-profile-panel]').forEach(p=>p.classList.toggle('active',p.dataset.profilePanel===profile));
    document.querySelectorAll('.profilebtn').forEach(b=>b.classList.toggle('active',b.dataset.profile===profile));
    activeProfile=profile;
    try{localStorage.setItem(PROFILE_KEY,profile)}catch(e){}
    openTab(activeTab,false);
    if(scroll) content.scrollTo({top:0,behavior:'auto'});
  }

  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab,true)));
  document.querySelectorAll('.profilebtn').forEach(b=>b.addEventListener('click',()=>openProfile(b.dataset.profile,true)));

  openProfile(activeProfile,false);
  openTab(activeTab,false);
})();
</script>
</body>
</html>
